name: daily_how
description: "The Daily How — a native Flutter rebuild of the Daily Curiosity app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.6.0

  # Fonts (Fraunces serif + Manrope sans, matching the original web theme)
  google_fonts: ^6.2.1

  # Local notifications for the 11:00 / 19:00 daily reminders
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Small persisted flags (reminder toggle, last-answered date cache)
  shared_preferences: ^2.3.2

  # Share button on fact cards
  share_plus: ^10.0.2

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
